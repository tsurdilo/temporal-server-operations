        to: 0
      datasourceUid: Prometheus  # DATASOURCE — change to match your Prometheus datasource name or UID
      model:
        editorMode: code
        expr: histogram_quantile(0.99, sum by (operation, le) (rate(persistence_latency_bucket{operation=~"CreateWorkflowExecution|UpdateWorkflowExecution|ConflictResolveWorkflowExecution|GetWorkflowExecution|GetCurrentExecution|AppendHistoryNodes|ReadHistoryBranch|CreateTasks|GetTasks|GetTransferTasks|GetTimerTasks|CompleteTransferTask|CompleteTimerTask"}[5m]))) > 0
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        reducer: last
        expression: A
        datasource: &id003
          type: __expr__
          uid: __expr__
        refId: B
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        datasource: *id003
        refId: C
        conditions:
        - evaluator:
            params:
            - 1
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
    noDataState: NoData
    execErrState: Error
    for: 5m
    labels:
      severity: critical
      service: temporal
      component: persistence
    annotations:
      __dashboardUid__: temporal-overview-v1
      __panelId__: '71'
      summary: 'Temporal: p99 persistence latency critical ({{ $values.B.Value | printf "%.3fs" }})'
      description: 'p99 persistence latency has exceeded 1s for a critical-path DB operation.

        Persistence latencies can cause delays writing and reading from the database,

        causing slowness for critical operations that support forward progress of workflow

        executions. Check the Persistence Latencies panel to identify which operation is slow.

        Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/12-persistence-latency-critical.md

        '
    isPaused: false

