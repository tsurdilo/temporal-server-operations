        editorMode: code
        expr: sum by (namespace) (rate(service_requests{service_name="frontend",namespace!="_unknown_"}[5m]))
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        datasource:
          type: __expr__
          uid: __expr__
        expression: A
        intervalMs: 1000
        maxDataPoints: 43200
        reducer: last
        refId: B
        settings:
          mode: dropNN
        type: reduce
    - refId: C
      datasourceUid: __expr__
      model:
        conditions:
        - evaluator:
            params:
            - 1
            type: lt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
        datasource:
          type: __expr__
          uid: __expr__
        expression: B
        refId: C
        type: threshold
    noDataState: NoData
    execErrState: Error
    for: 5m
    labels:
      severity: critical
      service: temporal
      component: frontend
    annotations:
      __dashboardUid__: temporal-overview-v1
      __panelId__: '20'
      summary: 'Temporal: RPS dropped to zero for namespace {{ $labels.namespace }} ({{ $values.B.Value | printf "%.2f" }} req/s)'
      description: 'Namespace {{ $labels.namespace }} is receiving no frontend requests. Other namespaces

        may be healthy. Check if alert 1 is also firing — if so this is cluster-wide.

        Otherwise check if workers for this namespace are running and connected.

        Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/04-namespace-rps-zero.md

        '
    isPaused: false

  # ---------------------------------------------------------------------------
  # Alert 8 — Shard Lock Latency Critical
  # ---------------------------------------------------------------------------
  - uid: temporal-alert-008
    title: 'Temporal: Shard Lock Latency Critical'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 600
        to: 0
      datasourceUid: Prometheus  # DATASOURCE — change to match your Prometheus datasource name or UID
      model:
        editorMode: code
        expr: histogram_quantile(0.99, sum by (le) (rate(semaphore_latency_bucket{operation="ShardInfo",service_name="history"}[5m]))) > 0
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        reducer: last
        expression: A
        datasource: &id002
          type: __expr__
          uid: __expr__
        refId: B
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        datasource: *id002
        refId: C
        conditions:
        - evaluator:
            params:
            - 0.3
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
    noDataState: NoData
    execErrState: Error
    for: 5m
    labels:
      severity: critical
      service: temporal
      component: history
    annotations:
      __dashboardUid__: temporal-overview-v1
      __panelId__: '14'
      summary: 'Temporal: p99 shard lock latency critical ({{ $values.B.Value | printf "%.3fs" }})'
      description: 'p99 shard lock latency has exceeded 300ms. This can indicate history service issues,

        elevated DB latencies holding the lock longer, or hot shard conditions from high

        frequency reuse of the same workflow ID. Check persistence latencies and workflow

        lock latency for correlation.

        Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/08-shard-lock-latency-critical.md

        '
    isPaused: false

