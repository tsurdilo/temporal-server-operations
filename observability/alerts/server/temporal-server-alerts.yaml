    for: 5m
    labels:
      severity: critical
      service: temporal
      component: history
    annotations:
      __dashboardUid__: temporal-overview-v1
      __panelId__: '2213'
      summary: 'Temporal: history task DLQ writes are failing ({{ $values.B.Value | printf "%.3f" }} failures/s)'
      description: 'Writes to the history task DLQ are themselves FAILING (task_dlq_failures). This is general — it applies to any history task type (transfer, timer, visibility, archival, outbound) — and severe: it means the database cannot even accept DLQ writes, typically because it is overloaded (e.g. a flood of tasks being dead-lettered onto the single-partition DLQ, driving lightweight-transaction / row-lock contention). Failed DLQ writes are retried indefinitely, adding still more load.


        Identify the source of the DLQ flood and relieve the database. A common cause is a sustained archival-backend outage under load (in which case pause archival — see the playbook). Related: Alert 80 fires when tasks are being written to the DLQ; this alert fires when those writes are failing (a worse, database-under-pressure condition).


        for: 5m at any rate > 0 — DLQ-write failures indicate active database distress; treat as critical.


        Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/82-history-task-dlq-write-failures.md

        '
    isPaused: false

  # ---------------------------------------------------------------------------
  # Alert 83 — Visibility Tasks Dead-Lettered
  # ---------------------------------------------------------------------------
  - uid: temporal-alert-083
    title: 'Temporal: Visibility Tasks Dead-Lettered'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: Prometheus  # DATASOURCE — change to match your Prometheus datasource name or UID
      model:
        editorMode: code
        expr: sum(rate(dlq_writes{operation=~"VisibilityTask.*"}[5m])) by (operation)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        reducer: last
        expression: A
        datasource: &id018
          type: __expr__
          uid: __expr__
        refId: B
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        datasource: *id018
        refId: C
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: critical
      service: temporal
      component: history
    annotations:
      __dashboardUid__: temporal-overview-v1
      __panelId__: '2128'
      summary: 'Temporal: visibility tasks being dead-lettered{{ if $labels.operation }} ({{ $labels.operation }}){{ end }}{{ if $value }} ({{ $values.B.Value | printf "%.3f" }} tasks/s){{ end }}'
      description: 'Visibility tasks have stopped being retried and are being written to the history task DLQ. A dead-lettered task is removed from the active queue and is NOT auto-retried, so the visibility record it carried is not written until an operator redrives the DLQ or rebuilds it.


        This is the end of the clock that starts when a visibility store breaks: unexpected errors retry up to history.TaskDLQUnexpectedErrorAttempts (default 70, roughly 70 minutes with jitter) and then stop. Workflows themselves are unaffected and keep running normally — what is lost is the visibility record.


        Which records stay wrong depends on the operation label. VisibilityTaskStartExecution and VisibilityTaskUpsertExecution repair themselves on the workflow''s next update or close, because every visibility write is a full snapshot. VisibilityTaskCloseExecution and VisibilityTaskDeleteExecution do NOT: a dropped close leaves the workflow listed as running forever, and a dropped delete leaves a record that should have been removed.


        IMPORTANT — on Elasticsearch this alert can over-report data loss. The bulk processor holds documents in memory; the store gives up waiting at worker.ESProcessorAckTimeout and fails the task, possibly into the DLQ, while the document is still buffered and gets flushed once Elasticsearch recovers. This has been observed directly: twelve tasks dead-lettered during an outage, and after recovery all twelve records were present. Verify against the store before declaring records lost. SQL has no such buffer, so on SQL a dead-lettered task really did lose the write.


        Alert 80 does NOT cover this — it matches only timer and transfer operations and excludes visibility by design.


        Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/83-visibility-tasks-dead-lettered.md

        '
    isPaused: false

  # ---------------------------------------------------------------------------
  # Alert 84 — Visibility Store Not Acknowledging Writes
  # ---------------------------------------------------------------------------
  - uid: temporal-alert-084
    title: 'Temporal: Visibility Store Not Acknowledging Writes'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: Prometheus  # DATASOURCE — change to match your Prometheus datasource name or UID
      model:
        editorMode: code
        expr: sum(rate(visibility_persistence_error_with_type{service_name="history",error_type="persistence_TimeoutError"}[5m])) by (visibility_index_name)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        reducer: last
        expression: A
        datasource: &id019
          type: __expr__
          uid: __expr__
        refId: B
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        datasource: *id019
        refId: C
        conditions:
        - evaluator:
            params:
            - 0.1
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
    noDataState: OK
    execErrState: Error
    for: 5m
    labels:
      severity: warning
      service: temporal
      component: history
    annotations:
      __dashboardUid__: temporal-overview-v1
      __panelId__: '2125'
      summary: 'Temporal: visibility writes not being acknowledged on {{ $labels.visibility_index_name }}{{ if $value }} ({{ $values.B.Value | humanize }} req/s){{ end }}'
      description: 'Elasticsearch visibility writes to {{ $labels.visibility_index_name }} are not being confirmed inside worker.ESProcessorAckTimeout (default 30s). The store is reachable enough to accept the connection but is not completing the write.


        This alert exists because NOTHING ELSE CATCHES THIS. persistence.TimeoutError is skipped by the visibility error classifier, so it does not appear on visibility_persistence_errors and therefore never fires alerts 59a/59b/59c. It also records no HTTP status, so the ES bulk processor error panel stays empty too. Confirmed on a live cluster: pausing Elasticsearch left both error panels flat while only this metric moved.


        Every failing attempt still counts toward history.TaskDLQUnexpectedErrorAttempts, so the same 70-minute data-loss clock is running as for a store that is fully down. Treat a sustained firing the same way you would treat alert 59b.


        Usual causes: Elasticsearch overloaded or garbage-collecting, an index flipped to read-only by a disk watermark, or a bulk processor that cannot keep up — check ES Bulk Processor Queue Depth and ES Write Confirm Latency vs Ack Timeout.


        SQL clusters will not fire this alert; SQL visibility writes are synchronous and fail with an unavailable error instead, which alerts 59a/59b do catch.


        Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/84-visibility-store-not-acknowledging-writes.md

        '
    isPaused: false

  # ---------------------------------------------------------------------------
  # Alert 85 — Visibility Read Errors
  # ---------------------------------------------------------------------------
  - uid: temporal-alert-085
    title: 'Temporal: Visibility Read Errors'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: Prometheus  # DATASOURCE — change to match your Prometheus datasource name or UID
      model:
        editorMode: code
        expr: sum(rate(visibility_persistence_errors{operation=~"ListWorkflowExecutions|CountWorkflowExecutions|GetWorkflowExecution|ListChasmExecutions|CountChasmExecutions"}[5m])) by (visibility_index_name, service_name)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        reducer: last
        expression: A
        datasource: &id020
          type: __expr__
          uid: __expr__
        refId: B
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        datasource: *id020
        refId: C
        conditions:
        - evaluator:
            params:
            - 0.1
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
    noDataState: OK
    execErrState: Error
    for: 2m
    labels:
      severity: critical
      service: temporal
      component: frontend
    annotations:
      __dashboardUid__: temporal-overview-v1
      __panelId__: '2123'
      summary: 'Temporal: visibility reads failing on {{ $labels.visibility_index_name }}{{ if $labels.service_name }} from {{ $labels.service_name }}{{ end }}{{ if $value }} ({{ $values.B.Value | humanize }} req/s){{ end }}'
      description: 'Visibility queries against {{ $labels.visibility_index_name }} are failing. This is user-facing: workflow list, count and describe are served by these operations, from the CLI, the Web UI and the SDKs.


        This alert deliberately does NOT filter on service_name="history". Reads are issued by frontend, worker and matching — never by history — which is exactly why alerts 59a/59b/59c cannot fire on read failures: all three filter to the history service and therefore only ever see writes.


        Under dual visibility there is NO read fallback. A visibility read goes to exactly one store, chosen by system.enableReadFromSecondaryVisibility, and if that store is failing the read fails — even when the other store holds the same records. Verified on a live cluster: workflow list returned "context deadline exceeded" while the secondary store held every record.


        Remediation, in order: move reads to the other store with system.enableReadFromSecondaryVisibility (a dynamic config change, effective in seconds, no restart) to give users a working workflow list, then fix the failing store. Be aware the other store only holds records written since dual writing was enabled, so the list may be shorter than expected — that is usually still better than a failing one.


        If service_name is worker, the failing reads are background work (schedules, batch operations, deletion) rather than user queries, which is less urgent but the same underlying store problem.


        Playbook: https://github.com/tsurdilo/temporal-metrics/blob/main/playbooks/dual-visibility.md


        Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/85-visibility-read-errors.md

        '
    isPaused: false
  # ---------------------------------------------------------------------------
  # Alert 86 — History Database Calls Rejected
  # ---------------------------------------------------------------------------
  - uid: temporal-alert-086
    title: 'Temporal: History Database Calls Rejected'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: Prometheus  # DATASOURCE — change to match your Prometheus datasource name or UID
      model:
        editorMode: code
        expr: sum(rate(persistence_errors_resource_exhausted{service_name="history"}[5m])) by (resource_exhausted_scope, resource_exhausted_cause)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        reducer: last
        expression: A
        datasource: &id021
          type: __expr__
          uid: __expr__
        refId: B
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        datasource: *id021
        refId: C
        conditions:
        - evaluator:
            params:
            - 10
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: warning
      service: temporal
      component: history
    annotations:
      __dashboardUid__: temporal-overview-v1
      __panelId__: '2405'
      summary: 'Temporal: history persistence rejecting {{ $values.B.Value | humanize }} database calls/s (cause {{ $labels.resource_exhausted_cause }}, {{ $labels.resource_exhausted_scope }} scope)'
      description: 'Database calls from the history service are being rejected before they reach the store.


        Check the cause label first. PersistenceLimit means Temporal''s own rate limiter turned the call away — the database is not failing, Temporal is choosing not to send the queries, and that is what the playbook and runbook below are about. Any other cause (SystemOverloaded, PersistenceStorageLimit) means the store itself pushed back, which is a different problem — see alert 30, System Overload Throttling.


        The scope label says which limit: System is the per-pod limit, Namespace is the per-namespace or per-shard one.


        Do not judge the size of this from the Resource Exhausted with Cause panel — that counts requests that failed, and most rejections never fail a request. This alert uses the metric that counts every rejection.


        Playbook: https://github.com/tsurdilo/temporal-metrics/blob/main/playbooks/history-persistence-qps-limits.md


        Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/86-history-database-calls-rejected.md

        '
    isPaused: false
  - uid: temporal-alert-087
    title: 'Temporal: History Write-Reject Loop'
    condition: C
    data:
    - refId: A
      relativeTimeRange:
        from: 300
        to: 0
      datasourceUid: Prometheus  # DATASOURCE — change to match your Prometheus datasource name or UID
      model:
        editorMode: code
        expr: ((sum(rate(workflow_context_cleared[5m])) > 0) / (sum(rate(cache_miss{cache_type="mutablestate"}[5m])) > 0)) and (sum(rate(persistence_errors_resource_exhausted{service_name="history",resource_exhausted_cause="PersistenceLimit"}[5m])) > 10)
        instant: true
        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        reducer: last
        expression: A
        datasource: &id022
          type: __expr__
          uid: __expr__
        refId: B
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        datasource: *id022
        refId: C
        conditions:
        - evaluator:
            params:
            - 5
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
    noDataState: OK
    execErrState: Error
    for: 10m
    labels:
      severity: critical
      service: temporal
      component: history
    annotations:
      __dashboardUid__: temporal-overview-v1
      __panelId__: '2403'
      summary: 'Temporal: history is discarding cached workflow state {{ $values.B.Value | humanize }}x faster than it is genuinely missing — the write-reject loop is running'
      description: 'The history service is caught in a loop: the persistence rate limiter refuses a task''s write, the pod throws away the cached workflow state it was holding, and every retry then has to read that state back from the database before it can try the write again. The reads crowd out the writes, so more writes are refused, and the loop sustains itself.


        This alert fires only when both things are true: mutable state is being discarded far faster than it is genuinely missing from the cache (ratio above 5), and history database calls are being refused by Temporal''s own limiter at more than 10/s. Alert 86 fires on the refusals alone; this one says the refusals have turned into a loop.


        What it is not: a cache that is too small. That would show as a high genuine cache-miss rate, and this alert requires the opposite — misses low while clearing is high. Resizing the history cache will not help.


        The fix is not to raise the persistence limit. It is to admit fewer tasks, so that the tasks that are admitted can finish: the history.taskScheduler rate limits in the playbook below.


        Playbook: https://github.com/tsurdilo/temporal-metrics/blob/main/playbooks/history-task-processing-tuning.md


        Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/87-history-write-reject-loop.md

        '
    isPaused: false
