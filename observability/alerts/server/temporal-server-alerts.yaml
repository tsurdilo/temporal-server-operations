          description: |
            Visibility store {{ $labels.visibility_index_name }} write error rate has
            exceeded 1 req/s — the store is effectively unavailable for writes.

            If visibility_index_name = temporal_visibility (primary):
              - workflow list/describe/count operations will fail immediately.
              - Temporal Web UI workflow list will be empty or return errors.
              - Restore the primary store first to unblock read operations.

