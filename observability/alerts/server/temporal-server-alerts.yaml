            1. kubectl scale statefulset <store-statefulset> -n temporal --replicas=1
            2. kubectl wait pod/<store-pod>-0 -n temporal --for=condition=Ready --timeout=5m
            3. Wait 30-60s for connection pool refresh — errors will stop automatically.

