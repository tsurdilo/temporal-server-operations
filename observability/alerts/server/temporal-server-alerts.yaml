      # ---------------------------------------------------------------------------
      # Alert 80 — History Task DLQ Stranding
      # ---------------------------------------------------------------------------
      - uid: temporal-alert-080
        title: "Temporal: History Task DLQ Stranding"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus  # DATASOURCE — change to match your Prometheus datasource name or UID
            model:
              editorMode: code
              expr: "sum(rate(dlq_writes{operation=~\"Timer(Active|Standby)TaskActivity(RetryTimer|Timeout)|Transfer(Active|Standby)Task(Activity|WorkflowTask)\"}[5m]))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 10m
        labels:
          severity: critical
          service: temporal
          component: history
        annotations:
          __dashboardUid__: temporal-overview-v1
          __panelId__: "2202"
          summary: "Temporal: history tasks being dead-lettered and stranding executions ({{ $value | printf \"%.3f\" }} tasks/s)"
          description: |
            Execution-stranding history tasks are being written to the history task DLQ (activity retry/timeout timers or activity/workflow-task dispatch). A DLQ'd task is removed from the active queue and is NOT auto-retried — for a retrying activity this strands the activity until an operator redrives the DLQ or pause/unpauses it. This is typically triggered by a prolonged database outage/overload driving persistence operations to time out (context deadline exceeded), which counts toward history.TaskDLQUnexpectedErrorAttempts (default 70 ≈ 1h). DB-agnostic (Cassandra and SQL alike).

            This condition is intentionally strict (any rate > 0 sustained 10m). If your cluster legitimately produces occasional stranding-type DLQ writes, raise the threshold or the `for` window to suit — see the runbook.

            Not paged here (informational only): visibility, retention (DeleteHistoryEvent), and workflow-task-timeout DLQ writes, and rate-limit rejections (ResourceExhausted, which are excused and never dead-lettered). Use the "Dead-Lettered Tasks" panels to see the per-operation breakdown.

            Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/80-history-task-dlq-stranding.md
        isPaused: false

