      # ---------------------------------------------------------------------------
      # Alert 82 — History Task DLQ Write Failures
      # ---------------------------------------------------------------------------
      - uid: temporal-alert-082
        title: "Temporal: History Task DLQ Write Failures"
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: Prometheus  # DATASOURCE — change to match your Prometheus datasource name or UID
            model:
              editorMode: code
              expr: "sum(rate(task_dlq_failures[5m]))"
              instant: true
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params: [0]
                    type: gt
                  operator:
                    type: and
                  query:
                    params: [A]
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              refId: C
              type: classic_conditions
        noDataState: OK
        execErrState: Error
        for: 5m
        labels:
          severity: critical
          service: temporal
          component: history
        annotations:
          __dashboardUid__: temporal-overview-v1
          __panelId__: "2213"
          summary: "Temporal: history task DLQ writes are failing ({{ $value | printf \"%.3f\" }} failures/s)"
          description: |
            Writes to the history task DLQ are themselves FAILING (task_dlq_failures). This is general — it applies to any history task type (transfer, timer, visibility, archival, outbound) — and severe: it means the database cannot even accept DLQ writes, typically because it is overloaded (e.g. a flood of tasks being dead-lettered onto the single-partition DLQ, driving lightweight-transaction / row-lock contention). Failed DLQ writes are retried indefinitely, adding still more load.

            Identify the source of the DLQ flood and relieve the database. A common cause is a sustained archival-backend outage under load (in which case pause archival — see the playbook). Related: Alert 80 fires when tasks are being written to the DLQ; this alert fires when those writes are failing (a worse, database-under-pressure condition).

            for: 5m at any rate > 0 — DLQ-write failures indicate active database distress; treat as critical.

            Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/82-history-task-dlq-write-failures.md
        isPaused: false
