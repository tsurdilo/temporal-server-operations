        intervalMs: 1000
        maxDataPoints: 43200
        refId: A
    - refId: B
      datasourceUid: __expr__
      model:
        type: reduce
        reducer: last
        expression: A
        datasource: &id004
          type: __expr__
          uid: __expr__
        refId: B
        settings:
          mode: dropNN
    - refId: C
      datasourceUid: __expr__
      model:
        type: threshold
        expression: B
        datasource: *id004
        refId: C
        conditions:
        - evaluator:
            params:
            - 0
            type: gt
          operator:
            type: and
          query:
            params:
            - C
          reducer:
            params: []
            type: last
          type: query
    noDataState: NoData
    execErrState: Error
    for: 1m
    labels:
      severity: critical
      service: temporal
      component: server
    annotations:
      __dashboardUid__: temporal-overview-v1
      __panelId__: '99'
      summary: 'Temporal: service panic detected in {{ $labels.service_name }}'
      description: 'A Go panic has been detected in the {{ $labels.service_name }} service. Depending

        on where the panic occurs this can cause shard loss, incomplete workflow state

        transitions, or task corruption. Check pod logs — the panic stack trace is the

        primary diagnostic artifact. Search logs for "panic".

        Runbook: https://github.com/tsurdilo/temporal-metrics/blob/main/observability/alerts/server/runbooks/25-service-panic-detected.md

        '
    isPaused: false

